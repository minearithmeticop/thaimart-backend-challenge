# Local development infrastructure and full stack.
# Everything at once: docker compose -f deploy/compose.yaml up -d --build
# Infra only (dev loop): docker compose -f deploy/compose.yaml up -d mongo
# With the data UI:      docker compose -f deploy/compose.yaml --profile tools up -d

name: thaimart

services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: thaimart-api
    ports:
      - "8080:8080"
      - "50051:50051"
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: thaimart
      JWT_SECRET: dev-secret-change-me
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:8
    container_name: thaimart-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # Web UI for browsing MongoDB data. Opt-in via the "tools" profile so it
  # only runs when asked for.
  mongo-express:
    image: mongo-express:1
    container_name: thaimart-mongo-express
    profiles: ["tools"]
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: "P@assw0rd1"
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo_data:
